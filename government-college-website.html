g-navy-600 rounded-2xl p-6 text-white"><div class="grid sm:grid-cols-3 gap-4 text-center">${[{n:D.students.length,l:'Total Students',i:'fa-users'},{n:D.students.filter(s=>s.status==='Active').length,l:'Active',i:'fa-circle-check'},{n:D.students.filter(s=>s.status==='Graduated').length,l:'Graduated',i:'fa-graduation-cap'}].map(s=>`<div><i class="fas ${s.i} text-2xl text-gold-400 mb-2"></i><div class="text-3xl font-black">${s.n}</div><div class="text-sm text-navy-200">${s.l}</div></div>`).join('')}</div></div></div>`}

function rresearchpg(){const r=D.research;return`<div class="max-w-7xl mx-auto px-4 py-12 fade-in"><div class="flex items-center gap-2 text-sm text-gray-500 mb-6"><span class="cursor-pointer hover:text-navy-600" data-nav="home">Home</span><i class="fas fa-chevron-right text-xs"></i><span class="text-navy-600 font-bold">Research</span></div><h2 class="font-heading text-4xl font-bold text-navy-600 mb-8">Research & <span class="text-gold-500">Innovation</span></h2><div class="grid lg:grid-cols-2 gap-8 mb-10"><div><h3 class="font-heading text-xl font-bold text-navy-700 mb-4"><i class="fas fa-file-lines text-gold-500 mr-2"></i>Publications</h3><div class="space-y-4">${r.publications.map(p=>`<div class="bg-white rounded-xl p-5 shadow-md border border-gray-100 card-hover"><h4 class="font-bold text-sm text-navy-700 mb-1">${p.title}</h4><p class="text-xs text-gray-500">${p.author} | ${p.journal} | ${p.year}</p></div>`).join('')}</div></div><div><h3 class="font-heading text-xl font-bold text-navy-700 mb-4"><i class="fas fa-diagram-project text-gold-500 mr-2"></i>Projects</h3><div class="space-y-4">${r.projects.map(p=>`<div class="bg-white rounded-xl p-5 shadow-md border border-gray-100 card-hover"><div class="flex items-center justify-between mb-1"><h4 class="font-bold text-sm text-navy-700">${p.title}</h4><span class="text-xs px-2 py-1 rounded-full font-bold ${p.status==='Completed'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}">${p.status}</span></div><p class="text-xs text-gray-500">PI: ${p.investigator} | ${p.funding}</p></div>`).join('')}</div></div></div><div class="bg-white rounded-2xl p-8 shadow-lg border border-gray-100"><h3 class="font-heading text-xl font-bold text-navy-700 mb-4"><i class="fas fa-user-graduate text-gold-500 mr-2"></i>Ph.D. Scholars</h3><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-navy-50 text-left"><th class="px-4 py-3 font-bold text-navy-700">Name</th><th class="px-4 py-3 font-bold text-navy-700">T function ras(){switch(cs){case 'dashboard':return radash();case 'settings':return hf('settings')?rasettings():vo('Settings',rasettingsinner());case 'hero-mgmt':return hf('hero')?rahero():vo('Hero',raheroinner());case 'about-mgmt':return hf('about')?raabout():vo('About',raaboutinner());case 'admission-mgmt':return ce('admission')?raadmission():vo('Admission',radmission());case 'admin-mgmt':return ce('admin')?raadminmgmt():vo('Administration',radminpg());case 'faculty-mgmt':return rafaculty();case 'students-mgmt':return ce('students')?rastudents():vo('Students',rstuddirpg());case 'library-mgmt':return hf('library')?ralibrary():vo('Library',rlibrarypg());case 'notices-mgmt':return ranotices();case 'research-mgmt':return raresearch();case 'eresources-mgmt':return ce('eresources')?raeresources():vo('E-Resources',reresourcespg());case 'events-mgmt':return raevents();case 'users-mgmt':return rausers();case 'changepw':return rachangepw();case 'activity-log':return raactivity();case 'reset':return rareset();default:return radash()}}

function radash(){return`<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">${[{n:D.faculty.length,l:'Faculty',i:'fa-chalkboard-user',c:'bg-blue-600'},{n:D.students.length,l:'Students',i:'fa-user-graduate',c:'bg-amber-600'},{n:D.studentCorner.notices.length,l:'Notices',i:'fa-bullhorn',c:'bg-red-600'},{n:D.events.length,l:'Events',i:'fa-images',c:'bg-purple-600'}].map(s=>`<div class="${s.c} rounded-xl p-5 text-white"><i class="fas ${s.i} text-2xl opacity-80 mb-2"></i><div class="text-3xl font-black">${s.n}</div><div class="text-sm opacity-80">${s.l}</div></div>`).join('')}</div><div class="bg-white rounded-xl p-6 shadow-sm border mb-6"><h3 class="font-bold text-navy-700 mb-3">Your Permissions</h3><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">${Object.entries(PM[cu.role]).map(([k,v])=>`<div class="flex items-center gap-2 text-sm py-1">${v===1?'<i class="fas fa-check-circle text-green-500"></i>':v===2?'<i class="fas fa-eye text-blue-500"></i>':v===3?'<i class="fas fa-pen text-amber-500"></i>':'<i class="fas fa-times-circle text-red-400"></i>'}<span class="${v===0?'text-gray-400':''}">${k}</span></div>`).join('')}</div></div>`}

function rasettingsinner(){const s=D.settings;return`<div class="space-y-4 max-w-3xl"><div class="mb-6"><label class="text-sm font-bold text-gray-700 block mb-2">College Logo</label><input type="file" accept="image/*" id="logoup" class="w-full border rounded-lg px-4 py-2 text-sm">${s.logo?`<img src="${s.logo}" class="mt-3 h-20 w-20 rounded-full object-cover border-2 border-gold-400">`:'<p class="text-xs text-gray-400 mt-1">No logo uploaded.</p>'}</div><div class="grid md:grid-cols-2 gap-4"><div><label class="text-sm font-bold text-gray-700 block mb-1">College Name</label><input name="collegeName" value="${esc(s.collegeName)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Short Name</label><input name="shortName" value="${esc(s.shortName)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div class="md:col-span-2"><label class="text-sm font-bold text-gray-700 block mb-1">Tagline</label><input name="tagline" value="${esc(s.tagline)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div class="md:col-span-2"><label class="text-sm font-bold text-gray-700 block mb-1">Address</label><textarea name="address" rows="2" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${esc(s.address)}</textarea></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Phone</label><input name="phone" value="${esc(s.phone)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Email</label><input name="email" value="${esc(s.email)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Fax</label><input name="fax" value="${esc(s.fax)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Established</label><input name="established" value="${esc(s.established)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Affiliated To</label><input name="affiliatedTo" value="${esc(s.affiliatedTo)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Approved By</label><input name="approvedBy" value="${esc(s.approvedBy)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div></div></div>`}
function rasettings(){return`<form id="sf" class="bg-white rounded-xl p-6 shadow-sm border">${rasettingsinner()}<button type="submit" class="bg-navy-600 hover:bg-navy-700 text-white font-bold px-6 py-2 rounded-lg transition mt-4"><i class="fas fa-save mr-2"></i>Save</button></form>`}

function raheroinner(){const s=D.settings;return`<div class="space-y-4 max-w-3xl"><div><label class="text-sm font-bold text-gray-700 block mb-1">Hero Background</label><input type="file" accept="image/*" id="heroup" class="w-full border rounded-lg px-4 py-2 text-sm">${s.heroImage?`<img src="${s.heroImage}" class="mt-3 rounded-lg h-40 object-cover">`:'<p class="text-xs text-gray-400 mt-1">Default background.</p>'}</div><div><label class="text-sm font-bold text-gray-700 block mb-1">Title</label><input name="collegeName" value="${esc(s.collegeName)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Tagline</label><input name="tagline" value="${esc(s.tagline)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div></div>`}
function rahero(){return`<form id="hf" class="bg-white rounded-xl p-6 shadow-sm border">${raheroinner()}<button type="submit" class="bg-navy-600 hover:bg-navy-700 text-white font-bold px-6 py-2 rounded-lg transition mt-4"><i class="fas fa-save mr-2"></i>Save</button></form>`}

function raaboutinner(){const a=D.about;return`<div class="space-y-4 max-w-3xl"><div><label class="text-sm font-bold text-gray-700 block mb-1">Content</label><textarea name="content" rows="6" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${esc(a.content)}</textarea></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Mission</label><textarea name="mission" rows="3" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${esc(a.mission)}</textarea></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Vision</label><textarea name="vision" rows="3" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${esc(a.vision)}</textarea></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Objectives (one per line)</label><textarea name="objectives" rows="8" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${(a.objectives||[]).join('\n')}</textarea></div></div>`}
function raabout(){return`<form id="abf" class="bg-white rounded-xl p-6 shadow-sm border">${raaboutinner()}<button type="submit" class="bg-navy-600 hover:bg-navy-700 text-white font-bold px-6 py-2 rounded-lg transition mt-4"><i class="fas fa-save mr-2"></i>Save</button></form>`}

function raadmission(){const a=D.admission;return`<form id="adf" class="bg-white rounded-xl p-6 shadow-sm border space-y-4 max-w-3xl"><div><label class="text-sm font-bold text-gray-700 block mb-1">Process</label><textarea name="process" rows="4" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${esc(a.process)}</textarea></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Eligibility</label><textarea name="eligibility" rows="3" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${esc(a.eligibility)}</textarea></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Documents (one per line)</label><textarea name="documents" rows="8" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${a.documents.join('\n')}</textarea></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Dates (Event | Date)</label><textarea name="importantDates" rows="8" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${a.importantDates.map(d=>d.event+' | '+d.date).join('\n')}</textarea></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Fees (Program | Amount)</label><textarea name="feeStructure" rows="5" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${a.feeStructure.map(f=>f.program+' | '+f.amount).join('\n')}</textarea></div><div><label class="text-sm font-bold text-gray-700 block mb-1">Seats (Program | Seats)</label><textarea name="seatMatrix" rows="5" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${a.seatMatrix.map(s=>s.program+' | '+s.seats).join('\n')}</textarea></div><button type="submit" class="bg-navy-600 hover:bg-navy-700 text-white font-bold px-6 py-2 rounded-lg transition"><i class="fas fa-save mr-2"></i>Save</button></form>`}

function raadminmgmt(){const ad=D.administration;return`<form id="amf" class="bg-white rounded-xl p-6 shadow-sm border space-y-4 max-w-3xl"><h3 class="font-bold text-navy-700 border-b pb-2">Principal</h3><div class="grid md:grid-cols-2 gap-4"><div><label class="text-sm font-bold block mb-1">Name</label><input name="pn" value="${esc(ad.principal.name)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Qualification</label><input name="pq" value="${esc(ad.principal.qualification)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Experience</label><input name="pe" value="${esc(ad.principal.experience)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Specialization</label><input name="ps" value="${esc(ad.principal.specialization)}" class="w-full border rounded-lg px-4 py-2 text-sm"></div><div class="md:col-span-2"><label class="text-sm font-bold block mb-1">Message</label><textarea name="pm" rows="3" class="w-full border rounded-lg px-4 py-2 text-sm resize-none">${esc(ad.principal.message)}</textarea></div><div class="md:col-span-2"><label class="text-sm font-bold block mb-1">Photo</label><input type="file" accept="image/*" id="ppup" class="w-full border rounded-lg px-4 py-2 text-sm">${ad.principal.photo?`<img src="${ad.principal.photo}" class="mt-2 rounded-lg h-24 w-24 object-cover">`:''}</div></div><h3 class="font-bold text-navy-700 border-b pb-2 mt-6">Staff</h3><div id="sl">${ad.staff.map((s,i)=>`<div class="grid grid-cols-12 gap-2 mb-2 items-end"><div class="col-span-3"><input name="sn_${i}" value="${esc(s.name)}" placeholder="Name" class="w-full border rounded px-3 py-2 text-sm"></div><div class="col-span-3"><input name="sd_${i}" value="${esc(s.designation)}" placeholder="Designation" class="w-full border rounded px-3 py-2 text-sm"></div><div class="col-span-3"><input name="sq_${i}" value="${esc(s.qualification)}" placeholder="Qualification" class="w-full border rounded px-3 py-2 text-sm"></div><div class="col-span-2"><input name="sp_${i}" value="${esc(s.phone)}" placeholder="Phone" class="w-full border rounded px-3 py-2 text-sm"></div><div class="col-span-1"><button type="button" data-act="rs" class="w-full py-2 text-red-500 hover:bg-red-50 rounded"><i class="fas fa-trash"></i></button></div></div>`).join('')}</div><button type="button" data-act="as" class="text-sm text-navy-600 font-bold hover:text-gold-600"><i class="fas fa-plus mr-1"></i>Add Staff</button><button type="submit" class="block bg-navy-600 hover:bg-navy-700 text-white font-bold px-6 py-2 rounded-lg transition mt-4"><i class="fas fa-save mr-2"></i>Save</button></form>`}

function rafaculty(){const role=cu.role;const list=role==='faculty'?D.faculty.filter(f=>f.userId===cu.id):D.faculty;const canE=ce('faculty');return`${role==='super'?`<div class="flex justify-between items-center mb-4"><p class="text-sm text-gray-500">${D.faculty.length} faculty</p><button data-act="af" class="bg-navy-600 hover:bg-navy-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition"><i class="fas fa-plus mr-2"></i>Add</button></div>`:`<p class="text-sm text-gray-500 mb-4">${role==='faculty'?'Your profile':'Faculty (view only)'}</p>`}<div class="bg-white rounded-xl shadow-sm border overflow-hidden"><table class="w-full text-sm"><thead><tr class="bg-navy-50 text-left"><th class="px-4 py-3 font-bold text-navy-700">Name</th><th class="px-4 py-3 font-bold text-navy-700">Dept</th><th class="px-4 py-3 font-bold text-navy-700">Designation</th><th class="px-4 py-3 font-bold text-navy-700">Actions</th></tr></thead><tbody>${list.map(f=>`<tr class="border-t border-gray-100 hover:bg-gray-50"><td class="px-4 py-3 font-medium">${f.name}</td><td class="px-4 py-3 text-gray-600">${f.department}</td><td class="px-4 py-3 text-gray-600">${f.designation}</td><td class="px-4 py-3">${canE?`<button data-act="ef" data-id="${f.id}" class="text-navy-600 hover:text-gold-600 mr-3"><i class="fas fa-edit"></i></button>${role==='super'?`<button data-act="df" data-id="${f.id}" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>`:''}`:'<span class="text-xs text-gray-400">View</span>'}</td></tr>`).join('')}</tbody></table></div>${ei&&ei.t==='fac'?rfacmod(ei.d):''}`}

function rfacmod(f){const n=!f.id;return`<div class="fixed inset-0 z-50 flex items-center justify-center modal-overlay"><div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto fade-in"><div class="flex justify-between items-center mb-4"><h3 class="font-heading text-lg font-bold text-navy-700">${n?'Add':'Edit'} Faculty</h3><button data-act="cfm" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button></div><form id="ff" class="space-y-3"><input type="hidden" name="id" value="${f.id||''}"><div class="grid md:grid-cols-2 gap-3"><div><label class="text-sm font-bold block mb-1">Name</label><input name="name" value="${esc(f.name||'')}" required class="w-full border rounded-lg px-3 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Department</label><input name="department" value="${esc(f.department||'')}" required class="w-full border rounded-lg px-3 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Designation</label><input name="designation" value="${esc(f.designation||'')}" required class="w-full border rounded-lg px-3 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Qualification</label><input name="qualification" value="${esc(f.qualification||'')}" required class="w-full border rounded-lg px-3 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Specialization</label><input name="specialization" value="${esc(f.specialization||'')}" class="w-full border rounded-lg px-3 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Email</label><input name="email" value="${esc(f.email||'')}" class="w-full border rounded-lg px-3 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Phone</label><input name="phone" value="${esc(f.phone||'')}" class="w-full border rounded-lg px-3 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Photo</label><input type="file" accept="image/*" name="photo" class="w-full border rounded-lg px-3 py-2 text-sm">${f.photo?`<img src="${f.photo}" class="mt-2 h-16 w-16 rounded object-cover">`:''}</div></div><div class="flex gap-3 pt-2"><button type="submit" class="bg-navy-600 hover:bg-navy-700 text-white font-bold px-6 py-2 rounded-lg text-sm">${n?'Add':'Update'}</button><button type="button" data-act="cfm" class="px-6 py-2 border rounded-lg text-gray-600 hover:bg-gray-50 text-sm">Cancel</button></div></form></div></div>`}

function rastudents(){const canE=ce('students');const canDel=cu.role==='super'||cu.role==='staff';return`<div class="flex justify-between items-center mb-4"><p class="text-sm text-gray-500">${D.students.length} students</p>${canE?`<button data-act="astud" class="bg-navy-600 hover:bg-navy-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition"><i class="fas fa-plus mr-2"></i>Add Student</button>`:''}</div>${D.students.length===0?`<div class="bg-white rounded-xl p-12 text-center border border-gray-100"><i class="fas fa-user-graduate text-5xl text-gray-300 mb-4"></i><h3 class="font-heading text-lg font-bold text-gray-500">No students yet</h3><p class="text-sm text-gray-400 mt-2">${canE?'Click "Add Student" to create the first record.':'No student records available.'}</p></div>`:`<div class="bg-white rounded-xl shadow-sm border overflow-hidden overflow-x-auto"><table class="w-full text-sm whitespace-nowrap"><thead><tr class="bg-navy-50 text-left"><th class="px-4 py-3 font-bold text-navy-700">Roll No</th><th class="px-4 py-3 font-bold text-navy-700">Name</th><th class="px-4 py-3 font-bold text-navy-700">Program</th><th class="px-4 py-3 font-bold text-navy-700">Year</th><th class="px-4 py-3 font-bold text-navy-700">Status</th><th class="px-4 py-3 font-bold text-navy-700">Actions</th></tr></thead><tbody>${D.students.map(s=>`<tr class="border-t border-gray-100 hover:bg-gray-50"><td class="px-4 py-3 font-mono text-xs">${esc(s.rollNo)}</td><td class="px-4 py-3 font-medium">${esc(s.name)}</td><td class="px-4 py-3 text-gray-600">${esc(s.program)}</td><td class="px-4 py-3 text-gray-600">Y${s.year}${s.semester?'/S'+s.semester:''}</td><td class="px-4 py-3"><span class="text-xs font-bold px-2 py-1 rounded-full ${s.status==='Active'?'bg-green-100 text-green-700':s.status==='Graduated'?'bg-blue-100 text-blue-700':'bg-red-100 text-red-700'}">${s.status}</span></td><td class="px-4 py-3">${canE?`<button data-act="estud" data-id="${s.id}" class="text-navy-600 hover:text-gold-60 function rastudmod(s){const n=!s.id;return`<div class="fixed inset-0 z-50 flex items-center justify-center modal-overlay"><div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto fade-in"><div class="flex justify-between items-center mb-4"><h3 class="font-heading text-lg font-bold text-navy-700">${n?'Add':'Edit'} Student</h3><button data-act="cstm" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button></div><form id="stf" class="space-y-3"><input type="hidden" name="id" value="${s.id||''}"><div class="grid md:grid-cols-2 gap-3"><div><label class="text-sm font-bold block mb-1">Roll No *</label><input name="rollNo" value="${esc(s.rollNo||'')}" required class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="e.g. GTEC-BED-2025-001"></div><div><label class="text-sm font-bold block mb-1">Full Name *</label><input name="name" value="${esc(s.name||'')}" required class="w-full border rounded-lg px-3 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Program *</label><select name="program" required class="w-full border rounded-lg px-3 py-2 text-sm"><option value="B.Ed." ${s.program==='B.Ed.'?'selected':''}>B.Ed.</option><option value="B.Ed. (Special Education)" ${s.program==='B.Ed. (Special Education)'?'selected':''}>B.Ed. (Special Education)</option><option value="M.Ed." ${s.program==='M.Ed.'?'selected':''}>M.Ed.</option></select></div><div><label class="text-sm font-bold block mb-1">Year *</label><select name="year" required class="w-full border rounded-lg px-3 py-2 text-sm"><option value="1" ${s.year==='1'?'selected':''}>Year 1</option><option value="2" ${s.year==='2'?'selected':''}>Year 2</option></select></div><div><label class="text-sm font-bold block mb-1">Semester</label><input name="semester" value="${esc(s.semester||'')}" placeholder="e.g. I, II, III, IV" class="w-full border rounded-lg px-3 py-2 text-sm"></div><div><label class="text-sm font-bold block mb-1">Gender</label><select name= const uf=a.querySelector('#uf');if(uf)uf.onsubmit=e=>{e.preventDefault();const d=fd(uf);const id=d.id;const users=gu();if(id){const idx=users.findIndex(x=>x.id==id);if(idx>-1){users[idx].name=d.name;users[idx].username=d.username;if(d.password)users[idx].password=d.password;users[idx].role=d.role;users[idx].facultyId=d.facultyId;users[idx].email=d.email}}else{users.push({id:gid(),username:d.username,password:d.password,role:d.role,name:d.name,facultyId:d.facultyId,email:d.email})}su(users);ei=null;aa(cu.name,id?'User updated':'User added',d.name);toast(id?'Updated!':'Added!');render()};


// Forgot Username/Password
a.querySelectorAll('[data-act="fun"]').forEach(e=>e.onclick=()=>{ei={t:'fun',d:{}};render()});
a.querySelectorAll('[data-act="fpw"]').forEach(e=>e.onclick=()=>{ei={t:'fpw',d:{}};render()});
a.querySelectorAll('[data-act="crf"]').forEach(e=>e.onclick=()=>{ei=null;render()});
const ffg=a.querySelector('#ffg');if(ffg)ffg.onsubmit=e=>{e.preventDefault();const d=fd(ffg);const users=gu();if(ei&&ei.t==='fun'){const u=users.find(x=>(x.email||'').toLowerCase()===d.email.toLowerCase());if(u){ei={t:'fun',d:{done:true,ok:true,msg:'Your username is: '+u.username}}}else{ei={t:'fun',d:{msg:'No account found with that email address',ok:false,email:d.email}}}render()}else if(ei&&ei.t==='fpw'){if(ei.d&&ei.d.done){ei=null;render();return}const u=users.find(x=>x.username===d.username&&(x.email||'').toLowerCase()===d.email.toLowerCase());if(!u){ei={t:'fpw',d:{msg:'Username and email do not match any account',ok:false,username:d.username,email:d.email}};render();return}if(d.newpw!==d.confpw){ei={t:'fpw',d:{msg:'Passwords do not match. Please try again.',ok:false,username:d.username,email:d.email}};render();return}if(d.newpw.length<4){ei={t:'fpw',d:{msg:'Password must be at least 4 characters long.',ok:false,username:d.username,email:d.email}};render();return}u.password=d.newpw;su(users);ei={t:'fpw',d:{done:true,ok:true,msg:'Password reset successfully! You can now log in with your new password.'}};render()}};

// Change Password (logged-in user)
const cpf=a.querySelector('#cpf');if(cpf)cpf.onsubmit=e=>{e.preventDefault();const d=fd(cpf);if(d.newpw!==d.confpw){toast('Passwords do not match!','danger');return}if(d.newpw.length<4){toast('Password too short (min 4 chars)!','danger');return}const users=gu();const idx=users.findIndex(x=>x.id===cu.id);if(idx>-1){users[idx].password=d.newpw;su(users);aa(cu.name,'Password changed','');toast('Password changed successfully!')}ei=null;render()};

if(sts&&stp&&sty&&ststat){const filt=()=>{const q=sts.value.trim().toLowerCase(),p=stp.value,y=sty.value,st=ststat.value;let visible=0;a.querySelectorAll('[data-stcard]').forEach(c=>{const nm=c.dataset.name||'',rl=c.dataset.roll||'',cp=c.dataset.prog||'',cy=c.dataset.year||'',cs=c.dataset.status||'';const ok=(!q||nm.includes(q)||rl.includes(q))&&(!p||cp===p)&&(!y||cy===y)&&(!st||cs===st);c.style.display=ok?'':'none';if(ok)visible++});const noRes=a.querySelector('#no-stud-res');if(noRes)noRes.style.display=visible===0?'':'none'};sts.oninput=filt;stp.onchange=filt;sty.onchange=filt;ststat.onchange=filt}
